
<div class="container mt-4">
  <h2 class="mb-4">Your Library</h2>

  <div class="row">
    <div class="col-md-4 mb-4" *ngFor="let song of tracks">
      <div class="card p-3">

        <img [src]="song.image"
             class="img-fluid rounded mb-3">

        <h5>{{ song.title }}</h5>
        <p>{{ song.artist }}</p>

        <button class="btn btn-skip"
                (click)="remove(song._id)">
          Remove
        </button>

      </div>
    </div>
  </div>
</div>
