
<div class="container mt-4">
  <h2 class="mb-4">Discover Music</h2>

  <button class="btn btn-spotify mb-4" (click)="loadTracks()">
    Refresh Songs
  </button>

  <div class="row">
    <div class="col-md-4 mb-4" *ngFor="let track of tracks">
      <div class="card p-3">

        <img [src]="track.album.images[0]?.url"
             class="img-fluid rounded mb-3">

        <h5>{{ track.name }}</h5>
        <p>{{ track.artists[0].name }}</p>

        <div class="d-flex gap-2">
          <button class="btn btn-spotify"
                  (click)="addToLibrary(track)">
            Add
          </button>

          <button class="btn btn-skip"
                  (click)="skip(track)">
            Skip
          </button>
        </div>

      </div>
    </div>
  </div>
</div>
